<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="湘味孕期菜谱">
  <meta name="theme-color" content="#fbf7f0">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>湘味孕期双人菜谱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: #fbf7f0;
      color: #3e2e1f;
      min-height: 100vh;
      padding: calc(20px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
      -webkit-text-size-adjust: 100%;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #fffcf8;
      border-radius: 22px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.06);
      padding: 22px 18px 26px;
      border: 1px solid #f0e3d5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px dashed #e5d6c6;
      padding-bottom: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .title { font-size: 24px; font-weight: 600; color: #7a5a3e; letter-spacing: -0.5px; }
    .badge {
      background: #efe2d3; font-size: 13px; padding: 3px 10px;
      border-radius: 20px; color: #6b4f36;
    }
    .btn-generate {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%;
      background: #d9b99b; border: none; color: #2d241c;
      font-weight: 600; font-size: 17px;
      padding: 15px 20px; border-radius: 16px;
      box-shadow: 0 4px 0 #b28b6f;
      margin-bottom: 22px;
      transition: transform 0.08s;
      font-family: inherit;
    }
    .btn-generate:active { transform: translateY(3px); box-shadow: 0 1px 0 #b28b6f; }
    .empty-message {
      text-align: center; color: #b29a84; font-size: 15px;
      padding: 48px 18px; background: #fbf5ee;
      border-radius: 18px; border: 1px dashed #dac9b8; line-height: 1.6;
    }
    .menu-wrapper { display: flex; flex-direction: column; gap: 18px; }
    .day-header {
      background: #f5ede4; border-radius: 30px; padding: 12px 18px;
      font-size: 15px; font-weight: 500; color: #5a3f2b;
      border: 1px solid #e1cebb;
    }
    .meals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 360px) { .meals-grid { grid-template-columns: 1fr; } }
    .meal-card {
      background: #fefcf9; border-radius: 16px; padding: 14px;
      border: 1px solid #eedbcb;
    }
    .meal-title {
      font-size: 16px; font-weight: 600; color: #8b6b4b;
      margin-bottom: 10px; border-left: 4px solid #d9b99b; padding-left: 8px;
    }
    .dish-list { display: flex; flex-direction: column; gap: 6px; }
    .dish-item {
      font-size: 14px; padding: 4px 0; color: #3e2e1f;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px dotted #f0dfce; gap: 6px;
    }
    .dish-item:last-child { border-bottom: none; }
    .portion {
      color: #a9876a; font-size: 11px; background: #f8f0e8;
      padding: 2px 8px; border-radius: 20px; flex-shrink: 0;
    }
    .shopping-section, .steps-section {
      background: #f8f2ea; border-radius: 18px; padding: 16px 16px 18px;
      border: 1px solid #eadaca;
    }
    .steps-section { background: #faf5ef; }
    .section-title {
      font-size: 17px; font-weight: 600; color: #6c4f36;
      margin-bottom: 12px; border-bottom: 1px solid #e2cfbd; padding-bottom: 8px;
    }
    .shopping-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .shopping-item {
      background: #fffbf7; padding: 6px 12px; border-radius: 20px;
      border: 1px solid #e7d6c4; font-size: 13px;
    }
    .steps-container { display: flex; flex-direction: column; gap: 14px; }
    .step-item {
      background: #fffdfa; border-radius: 12px; padding: 12px 14px;
      border-left: 4px solid #d9b99b;
    }
    .step-dish { font-weight: 600; font-size: 15px; color: #795f46; margin-bottom: 6px; }
    .step-method { font-size: 13px; line-height: 1.65; color: #3f3227; white-space: pre-line; }
    .footer-note {
      margin-top: 22px; font-size: 11px; color: #b6a18e;
      text-align: center; border-top: 1px solid #f0e2d3; padding-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="title">🌶️ 湘味孕期双人餐</span>
      <span class="badge">两人份</span>
    </div>

    <button class="btn-generate" id="randomBtn">🎲 随机生成明天菜谱</button>

    <div id="menuDisplay">
      <div class="empty-message">
        👩‍🍳 点击按钮，为夫妻二人生成营养均衡的湖南口味孕期一日三餐+加餐<br>
        <span style="font-size:13px;color:#c0a58e;">（不含腊味，辣度可调，孕期建议微辣）</span>
      </div>
    </div>

    <div class="footer-note">
      ⚕️ 菜谱仅供参考，请根据个人体质和医生建议调整食材，孕期建议少辣少盐。
    </div>
  </div>

  <script>
    // ========== 计算"明天"的完整日期 + 星期 ==========
    function getTomorrowInfo() {
      const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const month = tomorrow.getMonth() + 1;
      const day = tomorrow.getDate();
      const weekday = weekdays[tomorrow.getDay()];
      return `${month}月${day}日 ${weekday}`;
    }

    // ========== 20份湖南口味孕期夫妻菜谱（无腊味） ==========
    const recipePool = [
      {
        dayName: "湘味开胃",
        breakfast: ["剁椒蒸蛋", "小米南瓜粥"],
        lunch: ["辣椒炒肉(微辣)", "清炒莴笋丝", "杂粮饭"],
        dinner: ["剁椒蒸鲈鱼", "蒜蓉空心菜", "米饭"],
        snack: ["酸奶", "核桃仁", "砂糖橘"],
        shopping: ["鸡蛋4个","剁椒30g","小米80g","南瓜150g","猪瘦肉150g","青椒3个","莴笋1根","杂粮米150g","鲈鱼1条(约500g)","空心菜300g","大蒜1头","大米200g","无糖酸奶2杯","核桃仁30g","砂糖橘4个"],
        steps: [
          { dish: "剁椒蒸蛋", method: "1. 鸡蛋打散加温水(1:1.5)搅匀过滤；2. 表面铺一层剁椒(选低盐)，盖保鲜膜蒸10分钟；3. 出锅淋少许生抽和香油。" },
          { dish: "小米南瓜粥", method: "1. 小米洗净，南瓜去皮切小块；2. 加水煮25分钟至软烂粘稠。" },
          { dish: "辣椒炒肉(微辣)", method: "1. 瘦肉切片用生抽、淀粉腌10分钟，青椒切斜段；2. 热锅少油先炒肉片至变色盛出；3. 锅中留底油炒青椒，加少许豆豉，倒回肉片翻炒，加盐调味。" },
          { dish: "清炒莴笋丝", method: "1. 莴笋去皮切丝；2. 锅中少油清炒，加少许盐和蒜末。" },
          { dish: "剁椒蒸鲈鱼", method: "1. 鲈鱼处理干净划刀，抹少许盐；2. 铺姜片和剁椒(减量)，水开后蒸8-10分钟；3. 淋少许蒸鱼豉油，撒葱花浇热油。" },
          { dish: "蒜蓉空心菜", method: "1. 空心菜洗净切段；2. 蒜末爆香，下空心菜大火快炒，加盐。" }
        ]
      },
      {
        dayName: "鲜辣河鲜",
        breakfast: ["湖南米粉(清淡版)", "水煮蛋"],
        lunch: ["香辣虾(微辣)", "凉拌黄瓜", "米饭"],
        dinner: ["酸豆角炒肉末", "清炒丝瓜", "小米饭"],
        snack: ["热牛奶", "板栗", "苹果"],
        shopping: ["湖南米粉400g","鸡蛋2个","小葱2根","鲜虾400g","干辣椒5g","花椒3g","黄瓜2根","大米200g","酸豆角100g","猪肉末150g","丝瓜2根","小米100g","牛奶400ml","板栗仁50g","苹果2个"],
        steps: [
          { dish: "湖南米粉(清淡版)", method: "1. 米粉提前泡软；2. 骨汤或清水烧开，下米粉煮3分钟，加少许盐和葱花；3. 配水煮蛋。" },
          { dish: "香辣虾(微辣)", method: "1. 虾去须开背；2. 锅中少油爆香干辣椒和花椒(减量)，下虾炒至变色；3. 加姜蒜、少许生抽和糖翻炒均匀。" },
          { dish: "凉拌黄瓜", method: "1. 黄瓜拍碎切段；2. 加蒜末、醋、少许生抽、香油拌匀。" },
          { dish: "酸豆角炒肉末", method: "1. 酸豆角切小段，猪肉末加少许淀粉；2. 锅中少油炒肉末变色，加酸豆角翻炒，加少许糖和生抽调味。" },
          { dish: "清炒丝瓜", method: "1. 丝瓜去皮切滚刀块；2. 锅中少油清炒，加少许盐。" }
        ]
      },
      {
        dayName: "香辣暖身",
        breakfast: ["糖油粑粑(少糖)", "豆浆"],
        lunch: ["双椒炒鸡杂(微辣)", "清炒藕片", "糙米饭"],
        dinner: ["红烧冬瓜", "青椒炒鸡蛋", "米饭"],
        snack: ["酸奶", "瓜子仁", "橙子"],
        shopping: ["糯米粉200g","红糖30g","黄豆粉20g","无糖豆浆500ml","鸡杂300g","青椒2个","红椒1个","莲藕1节","糙米120g","冬瓜300g","青椒3个","鸡蛋3个","大米200g","酸奶2杯","瓜子仁30g","橙子2个"],
        steps: [
          { dish: "糖油粑粑(少糖)", method: "1. 糯米粉加温水揉团，搓小饼；2. 锅中少油煎至两面微黄；3. 加少量红糖水收汁，撒黄豆粉。" },
          { dish: "双椒炒鸡杂(微辣)", method: "1. 鸡杂处理干净切小块，焯水；2. 锅中少油爆香姜蒜，下鸡杂翻炒；3. 加青红椒段和少许生抽，大火快炒。" },
          { dish: "清炒藕片", method: "1. 莲藕去皮切薄片，泡水防氧化；2. 锅中少油清炒藕片，加少许盐和白醋。" },
          { dish: "红烧冬瓜", method: "1. 冬瓜去皮切块；2. 锅中少油炒冬瓜，加生抽、少许老抽和水，小火焖8分钟收汁。" },
          { dish: "青椒炒鸡蛋", method: "1. 青椒切块，鸡蛋打散；2. 先炒鸡蛋盛出，再炒青椒，混合加盐。" }
        ]
      },
      {
        dayName: "剁椒鲜香",
        breakfast: ["湖南碱面(清汤)", "煎蛋"],
        lunch: ["剁椒蒸排骨", "清炒豆角", "米饭"],
        dinner: ["辣椒炒荷包蛋", "蒜蓉娃娃菜", "紫薯饭"],
        snack: ["热牛奶", "杏仁", "猕猴桃"],
        shopping: ["碱面400g","鸡蛋4个","小葱2根","排骨400g","剁椒40g","豆角300g","大米200g","青椒3个","娃娃菜1颗","大蒜1头","紫薯1个","牛奶400ml","杏仁30g","猕猴桃2个"],
        steps: [
          { dish: "湖南碱面(清汤)", method: "1. 碱面煮熟捞出；2. 清汤加少许盐、葱花，浇在面上；3. 配煎蛋。" },
          { dish: "剁椒蒸排骨", method: "1. 排骨焯水，加姜片、少许生抽腌10分钟；2. 铺剁椒(减量)，上锅蒸30分钟至软烂。" },
          { dish: "清炒豆角", method: "1. 豆角切段焯水；2. 锅中少油清炒，加蒜末和盐。" },
          { dish: "辣椒炒荷包蛋", method: "1. 煎3个荷包蛋切块；2. 青椒切段炒香，加入荷包蛋翻炒，加少许生抽。" },
          { dish: "蒜蓉娃娃菜", method: "1. 娃娃菜洗净切段；2. 蒜末爆香，下娃娃菜炒软，加盐。" }
        ]
      },
      {
        dayName: "湘西风味",
        breakfast: ["湘西糍粑(少油)", "米浆"],
        lunch: ["湘西酸肉(少量)", "清炒南瓜丝", "米饭"],
        dinner: ["番茄炒蛋", "清炒红薯叶", "小米饭"],
        snack: ["酸奶", "花生仁", "香蕉"],
        shopping: ["糍粑4块","米浆500ml","湘西酸肉150g","南瓜300g","大米200g","番茄3个","鸡蛋3个","红薯叶300g","小米100g","酸奶2杯","花生仁30g","香蕉2根"],
        steps: [
          { dish: "湘西糍粑(少油)", method: "1. 糍粑切块；2. 平底锅少油小火煎至两面金黄。" },
          { dish: "湘西酸肉(少量)", method: "1. 酸肉切片蒸软；2. 锅中少油炒酸肉，加少许蒜苗提香(孕期少量食用)。" },
          { dish: "清炒南瓜丝", method: "1. 南瓜切丝；2. 锅中少油清炒，加少许盐。" },
          { dish: "番茄炒蛋", method: "1. 番茄切块，鸡蛋打散；2. 先炒鸡蛋盛出，再炒番茄出汁，混合加盐。" },
          { dish: "清炒红薯叶", method: "1. 红薯叶洗净；2. 蒜末爆香，大火快炒，加盐。" }
        ]
      },
      {
        dayName: "家常湘味",
        breakfast: ["葱油饼", "豆浆"],
        lunch: ["农家小炒肉(微辣)", "清炒莴笋", "杂粮饭"],
        dinner: ["紫苏煎黄瓜", "蒸蛋羹", "米饭"],
        snack: ["热牛奶", "腰果", "葡萄"],
        shopping: ["面粉300g","小葱3根","无糖豆浆500ml","五花肉150g","青椒4个","莴笋1根","杂粮米150g","紫苏叶20g","黄瓜2根","鸡蛋3个","大米200g","牛奶400ml","腰果30g","葡萄200g"],
        steps: [
          { dish: "葱油饼", method: "1. 面粉加温水揉团醒20分钟；2. 擀开抹油撒葱花，卷起再擀平；3. 平底锅少油煎至两面金黄。" },
          { dish: "农家小炒肉(微辣)", method: "1. 五花肉切薄片，青椒切斜段；2. 锅中少油煸炒五花肉出油，加青椒和豆豉翻炒，加少许生抽。" },
          { dish: "清炒莴笋", method: "1. 莴笋去皮切片；2. 锅中少油清炒，加盐。" },
          { dish: "紫苏煎黄瓜", method: "1. 黄瓜切厚片，紫苏切碎；2. 锅中少油煎黄瓜至微黄，加紫苏和少许盐翻炒。" },
          { dish: "蒸蛋羹", method: "1. 鸡蛋打散加温水搅匀过滤；2. 蒸10分钟，淋少许生抽和香油。" }
        ]
      },
      {
        dayName: "鲜辣开胃",
        breakfast: ["湖南卤粉(清淡)", "水煮蛋"],
        lunch: ["双椒鱼头(微辣)", "清炒菜心", "米饭"],
        dinner: ["豆豉蒸排骨", "蒜蓉茄子", "小米饭"],
        snack: ["酸奶", "南瓜籽", "梨"],
        shopping: ["湖南米粉400g","鸡蛋2个","小葱2根","鱼头1个(约600g)","剁椒30g","青椒2个","菜心300g","大米200g","排骨300g","豆豉20g","茄子2根","大蒜1头","小米100g","酸奶2杯","南瓜籽25g","梨2个"],
        steps: [
          { dish: "湖南卤粉(清淡)", method: "1. 米粉泡软煮熟；2. 加少许卤水(低盐)和葱花，配水煮蛋。" },
          { dish: "双椒鱼头(微辣)", method: "1. 鱼头处理干净，铺姜片；2. 铺剁椒和青椒碎(减量)，水开后蒸12分钟；3. 淋蒸鱼豉油，撒葱花浇热油。" },
          { dish: "清炒菜心", method: "1. 菜心洗净；2. 蒜末爆香，大火快炒，加盐。" },
          { dish: "豆豉蒸排骨", method: "1. 排骨焯水，加豆豉、姜片、少许生抽腌10分钟；2. 上锅蒸30分钟至软烂。" },
          { dish: "蒜蓉茄子", method: "1. 茄子切条蒸软；2. 蒜末爆香，浇在茄子上，加少许生抽和香油。" }
        ]
      },
      {
        dayName: "酸辣温和",
        breakfast: ["酸辣粉(微辣)", "煎蛋"],
        lunch: ["酸萝卜炒牛肉", "清炒西葫芦", "米饭"],
        dinner: ["番茄鱼片", "清炒油麦菜", "杂粮饭"],
        snack: ["热牛奶", "栗子仁", "苹果"],
        shopping: ["红薯粉300g","鸡蛋2个","小葱2根","酸萝卜100g","牛里脊250g","西葫芦1根","大米200g","龙利鱼柳300g","番茄3个","油麦菜300g","杂粮米150g","牛奶400ml","栗子仁50g","苹果2个"],

    const menuDisplay = document.getElementById('menuDisplay');
    const randomBtn = document.getElementById('randomBtn');

    function renderMenu(index) {
      const recipe = recipePool[index];
      if (!recipe) return;

      const tomorrowInfo = getTomorrowInfo();

      const mealsHTML = `
        <div class="menu-wrapper">
          <div class="day-header">📅 ${tomorrowInfo} · ${recipe.dayName} · 孕期双人餐</div>
          <div class="meals-grid">
            <div class="meal-card">
              <div class="meal-title">🌅 早餐</div>
              <div class="dish-list">
                ${recipe.breakfast.map(d => `<div class="dish-item"><span>${d}</span><span class="portion">两人份</span></div>`).join('')}
              </div>
            </div>
            <div class="meal-card">
              <div class="meal-title">☀️ 午餐</div>
              <div class="dish-list">
                ${recipe.lunch.map(d => `<div class="dish-item"><span>${d}</span><span class="portion">两人份</span></div>`).join('')}
              </div>
            </div>
            <div class="meal-card">
              <div class="meal-title">🌙 晚餐</div>
              <div class="dish-list">
                ${recipe.dinner.map(d => `<div class="dish-item"><span>${d}</span><span class="portion">两人份</span></div>`).join('')}
              </div>
            </div>
            <div class="meal-card">
              <div class="meal-title">🍎 加餐</div>
              <div class="dish-list">
                ${recipe.snack.map(d => `<div class="dish-item"><span>${d}</span><span class="portion">两人份</span></div>`).join('')}
              </div>
            </div>
          </div>

          <div class="shopping-section">
            <div class="section-title">🛍️ 采购清单 · 两人份</div>
            <div class="shopping-grid">
              ${recipe.shopping.map(item => `<div class="shopping-item">${item}</div>`).join('')}
            </div>
          </div>

          <div class="steps-section">
            <div class="section-title">👩‍🍳 详细做法</div>
            <div class="steps-container">
              ${recipe.steps.map(step => `
                <div class="step-item">
                  <div class="step-dish">${step.dish}</div>
                  <div class="step-method">${step.method}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      menuDisplay.innerHTML = mealsHTML;
    }

    randomBtn.addEventListener('click', () => {
      const idx = Math.floor(Math.random() * recipePool.length);
      renderMenu(idx);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
